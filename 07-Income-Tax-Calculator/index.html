 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income Tax Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #164e63, transparent 35%),
                radial-gradient(circle at bottom right, #14532d, transparent 35%),
                #020617;

            color: white;
            overflow: hidden;
        }

        /* Main Card */
        #parent {
            width: 430px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;

            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(34, 197, 94, 0.08);

            text-align: center;

            position: relative;
        }

        /* Top glow */
        #parent::before {
            content: "";
            position: absolute;

            width: 120px;
            height: 120px;

            background: #22c55e;
            filter: blur(80px);

            top: -50px;
            right: -40px;

            opacity: 0.3;
            z-index: -1;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Form */
        form {
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 10px;

            color: #cbd5e1;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 15px 16px;

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;

            outline: none;

            background: rgba(0, 0, 0, 0.25);
            color: white;

            font-size: 17px;

            transition: 0.3s;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #22c55e;

            box-shadow:
                0 0 0 3px rgba(34, 197, 94, 0.15),
                0 0 20px rgba(34, 197, 94, 0.1);
        }

        /* Button */
        button {
            width: 100%;

            margin-top: 22px;
            padding: 14px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.25);

            transition: 0.25s;
        }

        button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 30px rgba(34, 197, 94, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Result */
        h2 {
            margin-top: 30px;

            padding: 18px;

            border-radius: 14px;

            background: rgba(0, 0, 0, 0.25);

            border: 1px solid rgba(255, 255, 255, 0.08);

            color: #e2e8f0;

            font-size: 20px;
        }

        /* Mobile */
        @media (max-width: 500px) {

            #parent {
                width: 90%;
                padding: 30px 25px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div id="parent">

        <h1>💰 Income Tax Calculator</h1>

        <p class="subtitle">
            Calculate your estimated income tax instantly
        </p>

        <form>

            <label for="income">
                Annual Income
            </label>

            <input
                type="number"
                id="income"
                name="income"
                placeholder="Enter your annual income"
            >

            <button type="submit">
                Calculate Tax
            </button>

        </form>

        <h2>
            Total Tax: ₹0
        </h2>

    </div>

    <script src="first.js"></script>

</body>

</html>
